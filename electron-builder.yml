appId: com.multimind.browser
productName: MultiMind Flow
publish:
  provider: github
  owner: pairusuo
  repo: multimind-flow
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: build/icon.ico
    to: icon.ico
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

mac:
  icon: build/icon.icns
  artifactName: MultiMind-Flow-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.productivity
  identity: null

dmg:
  iconSize: 128
  iconTextSize: 14
  window:
    width: 720
    height: 440
  contents:
    - x: 200
      y: 250
      type: file
    - x: 520
      y: 250
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  artifactName: MultiMind-Flow-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  # Resource editing installs the product icon and version metadata into the
  # EXE. It remains enabled even when no code-signing certificate is configured.
  signAndEditExecutable: true

nsis:
  oneClick: false
  # Keep both supported scopes. In assisted mode, false shows the
  # "current user / all users" choice instead of forcing a per-user install.
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  uninstallDisplayName: MultiMind Flow
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
